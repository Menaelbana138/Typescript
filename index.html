<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>Employee Management System</h1>

    <section id="dashboard" class="dashboard"></section>

    <section class="form-section">
      <h2 id="form-title">Add Employee</h2>
      <form id="employee-form">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <select id="department" required>
          <option value="" disabled selected>Select Department</option>
          <option value="IT">IT</option>
          <option value="HR">HR</option>
          <option value="Sales">Sales</option>
          <option value="Front">Frontend</option>
          <option value="Back">Backend</option>
          <option value="Flutter">Flutter</option>

        </select>
        <input type="number" id="salary" placeholder="Salary" required>
        <input type="date" id="hireDate" required>
        <button type="submit" id="submit-btn">Add Employee</button>
        <button type="button" id="cancel-btn" class="hidden">Cancel</button>
      </form>
    </section>

    <section class="search-section">
      <input type="text" id="search" placeholder="Search by name or department...">
    </section>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Hire Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employee-table-body"></tbody>
      </table>
    </section>
  </div>

  <script type="module" src="./dist/app.js"></script>
</body>
</html>
